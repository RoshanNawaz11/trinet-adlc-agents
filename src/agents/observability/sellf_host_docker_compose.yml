#the env is outside of this folder so make sure to add the env whle running the docker compose

services:
  app:
    image: langwatch/langwatch:latest
    ports:
      - "5560:5560"
    environment:
      DATABASE_URL: postgresql://langwatch:langwatch@postgres:5432/langwatch
      CLICKHOUSE_URL: http://default:${CLICKHOUSE_PASSWORD}@clickhouse:8123/langwatch
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      BASE_HOST: http://localhost:5560
      NEXTAUTH_URL: http://localhost:5560
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      API_TOKEN_JWT_SECRET: ${API_TOKEN_JWT_SECRET}
      CREDENTIALS_SECRET: ${CREDENTIALS_SECRET}
      LANGWATCH_NLP_SERVICE: http://langwatch_nlp:5561
      LANGWATCH_ENDPOINT: http://app:5560
      LANGEVALS_ENDPOINT: http://langevals:5562
    depends_on:
      - postgres
      - redis
      - clickhouse

  workers:
    image: langwatch/langwatch:latest
    working_dir: /app/platform/app
    command: ["pnpm", "run", "start:workers"]
    restart: always
    environment:
      DATABASE_URL: postgresql://langwatch:langwatch@postgres:5432/langwatch
      CLICKHOUSE_URL: http://default:${CLICKHOUSE_PASSWORD}@clickhouse:8123/langwatch
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      BASE_HOST: http://localhost:5560
      NEXTAUTH_URL: http://localhost:5560
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      API_TOKEN_JWT_SECRET: ${API_TOKEN_JWT_SECRET}
      CREDENTIALS_SECRET: ${CREDENTIALS_SECRET}
      LANGWATCH_NLP_SERVICE: http://langwatch_nlp:5561
      LANGWATCH_ENDPOINT: http://app:5560
      LANGEVALS_ENDPOINT: http://langevals:5562
    depends_on:
      - postgres
      - redis
      - clickhouse

  langwatch_nlp:
    image: langwatch/langwatch_nlp:latest
    ports:
      - "5561:5561"

  langevals:
    image: langwatch/langevals:latest
    ports:
      - "5562:5562"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: langwatch
      POSTGRES_PASSWORD: langwatch
      POSTGRES_DB: langwatch
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine

  clickhouse:
    image: langwatch/clickhouse-serverless:0.2.0
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse

volumes:
  postgres_data:
  clickhouse_data: