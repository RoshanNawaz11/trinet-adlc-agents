# node -> model config. Read by model/gateway.py, called for real whenever
# ANTHROPIC_API_KEY is set. Nodes without an entry use `default`.
#
# `temperature` is kept here as documented per-node intent (e.g.
# "orchestrator/worker should be as deterministic as possible") but is NOT
# actually sent to the API — Anthropic removed temperature/top_p/top_k for
# current models, and the anthropic 1.x SDK dropped the parameter from
# messages.create() entirely. See model/gateway.py's complete() for detail.

default:
  model: claude-haiku-4-5-20251001
  temperature: 0.2

planner:
  model: claude-haiku-4-5-20251001
  temperature: 0.0

# validation runs with MCP tools (tools/bindings.py reads max_tokens here);
# its many checks overran the 4096 default
validation:
  model: claude-haiku-4-5-20251001
  max_tokens: 8192

# combining worker results ran out at 4096; their workers share these entries
compliance:
  model: claude-haiku-4-5-20251001
  max_tokens: 8192

payroll-calculation:
  model: claude-haiku-4-5-20251001
  max_tokens: 16384           # combining four workers ran out at 8192

# checks the whole package against every agent's result; 4096 ran out
output-validator:
  model: claude-haiku-4-5-20251001
  max_tokens: 8192

# the brief grows with every agent's result; 4096 ran out mid-answer
orchestrator:
  model: claude-haiku-4-5-20251001
  max_tokens: 8192
