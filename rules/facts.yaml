benefits_billed_to_client: {meaning: what the client is billed for benefits, type: money, source: payroll.benefits}

# ── payroll: net pay and checks against the system ────────────────────────

system_taxes:       {meaning: "the payroll system's tax figures for this pay, total", type: money, source: data — the payroll system; null when it has none}
system_net_pay:     {meaning: the payroll system's net pay for this pay, type: money, source: data}
system_total_gross: {meaning: "the payroll system's total gross for this pay, leave payout included", type: money, source: data}
system_deductions:  {meaning: the payroll system's deductions for this pay, type: money, source: data}
system_leave_payout: {meaning: the payroll system's leave payout, type: money, source: data}
system_figures_stale: {meaning: "whether the system's figures predate the latest change to hours, rate or leave", type: yes_no, source: derived}
inputs_provisional: {meaning: whether any input to net pay is provisional, type: yes_no, source: derived — from earnings and leave-payout}
taxes:              {meaning: the taxes on final pay, type: money, source: payroll.net-pay}
unrecoverable:      {meaning: deductions that can't be taken from final pay, type: money, source: payroll.net-pay}
net_pay:            {meaning: the final net pay, type: money, source: payroll.net-pay}
net_match:          {meaning: whether our net pay matches the system's within $0.01, type: yes_no, source: payroll.matches-system}
gross_match:        {meaning: whether our gross matches the system's within $0.01, type: yes_no, source: payroll.matches-system}
order_match:        {meaning: whether the order's total matches the system's, type: yes_no, source: payroll.matches-system}
differing_line:     {meaning: the line that explains a difference, type: choice, values: [taxes, deductions, leave_payout, gross], source: payroll.matches-system}

# ── payroll: payment method ───────────────────────────────────────────────

payment_method_on_file: {meaning: the payment method on file, type: choice, values: [direct_deposit, check, live_check], source: data — "Direct Deposit" → direct_deposit}
method_active:      {meaning: whether the method on file is active, type: yes_no, source: data}
prenote_verified:   {meaning: whether the direct deposit account is verified, type: yes_no, source: data}
deposit_consent:    {meaning: whether the employee consented to direct deposit, type: yes_no, source: data}
arrives_by_due_date: {meaning: whether the method's cut-off reaches the due date, type: yes_no, source: derived}
other_method_arrives: {meaning: whether another method would still arrive in time, type: yes_no, source: derived}
mailing_address_current: {meaning: whether the mailing address on record is current, type: yes_no, source: data}
payment_method:     {meaning: the method final pay is paid by, type: choice, values: [direct_deposit, check, live_check], source: payroll.payment-method}
