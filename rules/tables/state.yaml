# State table — what each work state's law says, by termination type.
# Looked up by [state, termination_type]; the matching row's values become
# facts (see rules/facts.yaml). No row → every value is null: not available,
# never another state's rule.
#
# Source: the legal rule records in the mock data (one per state).

id: tables.state
keys: [state, termination_type]
values: [requirement, due, due_amount, due_text, allowed_methods, payee_on_death]

rows:
  - {state: CA, termination_type: involuntary, requirement: required, due: immediately,
     due_amount: null, due_text: "Final wages due immediately at the time of discharge.",
     allowed_methods: [live_check],
     payee_on_death: null}
  - {state: CA, termination_type: voluntary, requirement: required, due: within_hours,
     due_amount: 72, due_text: "Final wages due within 72 hours; on the last day if 72 hours notice was given.",
     allowed_methods: [check, direct_deposit_with_consent],
     payee_on_death: null}
  - {state: CA, termination_type: death, requirement: required, due: null,
     due_amount: null, due_text: null,
     allowed_methods: [check],
     payee_on_death: "The surviving spouse or estate representative, on request."}

