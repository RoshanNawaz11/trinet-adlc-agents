id: compliance.exceptions
version: 2
agent: compliance
worker: exceptions
purpose: Find anything on record that takes the case off the standard path — a leave of absence or an active garnishment.

applies_to: {state: any, pay_group: any, employment_type: any, termination_type: any}

inputs: [records_fetched, on_leave_of_absence, last_day_worked]

lines:
  - for_each: leave_records
    each: [leave_status, leave_end_date, leave_kind]
    cases:
      - when: "leave_status == 'open' and (leave_end_date is None or leave_end_date >= last_day_worked)"
        then: {active: true,
               flag: {kind: decision, type: complianceException, title: "Open leave of absence",
                      detail: {kind: leave, leave_kind: "= leave_kind", end_date: "= leave_end_date"}}}
        why: Terminated while on leave counts as active. A work-injury or disability leave is reported by kind — some states protect it.
      - when: true
        then: {active: false, note: "A leave on record ended before the last day worked"}
    total:
      active_leaves: {count: active, where: "active is True"}

  - for_each: garnishment_orders
    each: [garnishment_status, garnishment_kind, set_up_in_payroll]
    cases:
      - when: "garnishment_status in ['released', 'satisfied']"
        then: {active: false}
      - when: true
        then: {active: true,
               flag: {kind: decision, type: complianceException, title: "Active garnishment",
                      detail: {kind: garnishment, garnishment_kind: "= garnishment_kind"}}}
        why: An order received but not yet set up counts as active; payroll.deductions flags the setup too.
    total:
      active_garnishments: {count: active, where: "active is True"}

cases:
  - when: "records_fetched is False"
    then: {result: not available}
    why: Never assume there is none.
  - when: "on_leave_of_absence is True and active_leaves == 0"
    then: {result: fail, outcome: stop,
           flag: {kind: decision, type: complianceException, title: "The employee's status is on leave", detail: {kind: leave}}}
  - when: "active_leaves > 0 or active_garnishments > 0"
    then: {result: fail, outcome: stop}
  - when: true
    then: {result: pass}

outputs: [result, active_leaves, active_garnishments, outcome]

to_confirm:
  - An active garnishment stops the case (team rule C9), or is it flagged and payroll deducts it?
