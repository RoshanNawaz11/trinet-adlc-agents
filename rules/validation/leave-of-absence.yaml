id: validation.leave-of-absence
version: 1
agent: validation
worker: validator
purpose: Find an open leave of absence — the analyst opens a separate LOA case before the termination is worked.

applies_to: {state: any, pay_group: any, employment_type: any, termination_type: any}

inputs: [leave_records_fetched, on_leave_of_absence, last_day_worked]

lines:
  - for_each: leave_records
    each: [leave_status, leave_end_date, leave_kind]
    cases:
      - when: "leave_status == 'open' and (leave_end_date is None or leave_end_date >= last_day_worked)"
        then: {active: true,
               flag: {kind: decision, type: leaveOfAbsence, title: "Open leave of absence — open an LOA case first",
                      detail: {leave_kind: "= leave_kind", end_date: "= leave_end_date"}}}
        why: Terminated while on leave counts as active. A work-injury or disability leave is reported by kind — some states protect it.
      - when: true
        then: {active: false, note: "A leave on record ended before the last day worked"}
    total:
      active_leaves: {count: active, where: "active is True"}

cases:
  - when: "leave_records_fetched is False"
    then: {result: not available}
    why: Never assume there is none.
  - when: "on_leave_of_absence is True and active_leaves == 0"
    then: {result: fail, outcome: stop,
           flag: {kind: decision, type: leaveOfAbsence, title: "The employee's status is on leave — open an LOA case first"}}
  - when: "active_leaves > 0"
    then: {result: fail, outcome: stop}
    why: The LOA case comes first, then this order is validated again (job map J2.6).
  - when: true
    then: {result: pass}

outputs: [result, active_leaves, outcome]
