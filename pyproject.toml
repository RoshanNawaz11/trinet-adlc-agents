[project]
name = "trinet-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.7.0",
    "arq>=0.28.0",
    "fastapi>=0.141.1",
    "fastmcp>=3.4.7",
    "httpx>=0.27.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langwatch>=1.4.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "simpleeval>=1.0.8",
    "uvicorn[standard]>=0.53.0",
]

# Not an installable package: uv only installs the dependencies, and the code
# runs from src/ (run_so.py, runtime/server.py and runtime/runner.py add it
# to the path; pytest uses pythonpath below).
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
